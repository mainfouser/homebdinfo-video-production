name: Generate Long Video (16:9)

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Optional specific Topic ID from Video Script sheet (leave empty for next pending)"
        required: false
        default: ""
      max_videos:
        description: "How many long videos to process in this run"
        required: false
        default: "1"

permissions:
  contents: write
  releases: write

jobs:
  build-long-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-noto-extra

      - name: Install Python packages and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts gspread google-auth Pillow requests playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run Long Video Generator
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
          MAX_VIDEOS: ${{ github.event.inputs.max_videos }}
          VOICE_NAME: ${{ vars.VOICE_NAME || 'bn-BD-NabanitaNeural' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python make_long_video.py

      - name: Create GitHub Release and Upload Video
        id: create_release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # চেক করা ফাইল আছে কিনা
          if ls output/*.mp4 1> /dev/null 2>&1; then
            TAG_NAME="video-v${{ github.run_number }}"
            echo "Creating Release $TAG_NAME..."
            
            # তৈরি ক্রিয়েট ও ফাইল আপলোড
            gh release create "$TAG_NAME" output/*.mp4 --title "Long Video Production Run #${{ github.run_number }}" --notes "Automated video production build."
            
            # প্রথম MP4 ফাইলের লিঙ্ক বের করা
            VIDEO_FILE=$(ls output/*.mp4 | head -n 1)
            FILE_NAME=$(basename "$VIDEO_FILE")
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${FILE_NAME}"
            
            # HTML প্লেয়ার লিঙ্ক (vidsrc/browser rendering proxy)
            STREAM_URL="https://html5player.gyazo.com/player?url=${RELEASE_URL}"
            
            # টেলিগ্রামে রিলিজ ও স্ট্রিমিং লিঙ্ক নোটিফিকেশন পাঠানো
            MSG="🎬 <b>New Long Video Released!</b>%0A%0A📌 <b>Run:</b> #${{ github.run_number }}%0A📥 <b>Direct Download:</b> <a href='${RELEASE_URL}'>Download MP4</a>%0A▶️ <b>Watch / Stream (Player):</b> <a href='${RELEASE_URL}'>Play Video</a>"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=HTML"
          else
            echo "No output MP4 files found to release."
          fi

      - name: Send Failure Notification to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>GitHub Actions Video Generation Failed!</b>%0A• <b>Workflow:</b> Generate Long Video (16:9)%0A• <b>Run ID:</b> #${{ github.run_number }}%0A• <b>Link:</b> <a href='${RUN_URL}'>View Failed Job Log</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML"
