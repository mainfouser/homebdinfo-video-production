name: Generate Long Video (16:9)

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Optional specific Topic ID from Video Script sheet (leave empty for next pending)"
        required: false
        default: ""
      max_videos:
        description: "How many long videos to process in this run"
        required: false
        default: "1"

permissions:
  contents: write
  releases: write

jobs:
  build-long-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-noto-extra

      - name: Install Python packages and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts gspread google-auth Pillow requests playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Generate Long Video
        id: generate_video
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
          MAX_VIDEOS: ${{ github.event.inputs.max_videos }}
          VOICE_NAME: ${{ vars.VOICE_NAME || 'bn-BD-NabanitaNeural' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p output
          python make_long_video.py
          if compgen -G "output/*.mp4" > /dev/null; then
            echo "has_video=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_video=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated long video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebdinfo-long-videos-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: ignore

      - name: Publish Video to GitHub Release & Notify Telegram
        if: steps.generate_video.outputs.has_video == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TAG_NAME="long-video-run-${{ github.run_number }}"

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" output/*.mp4 --clobber
          else
            gh release create "$TAG_NAME" output/*.mp4 \
              --title "Long Video Build #${{ github.run_number }}" \
              --notes "Automated 16:9 video build from workflow run #${{ github.run_number }}."
          fi

          for VIDEO_FILE in output/*.mp4; do
            FILE_NAME=$(basename "$VIDEO_FILE")
            RELEASE_ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${FILE_NAME}"
            RELEASE_PAGE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            MSG="🎬 <b>Long Video Ready!</b>%0A• <b>File:</b> <code>${FILE_NAME}</code>%0A• <b>Run:</b> #${{ github.run_number }}%0A• <b>Direct Video / Stream URL:</b> <a href='${RELEASE_ASSET_URL}'>Open MP4</a>%0A• <b>Release Page:</b> <a href='${RELEASE_PAGE_URL}'>View Release</a>"

            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${MSG}" \
                -d "parse_mode=HTML" > /dev/null
            fi
          done

      - name: Send Failure Notification to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>GitHub Actions Video Generation Failed!</b>%0A• <b>Workflow:</b> Generate Long Video (16:9)%0A• <b>Run ID:</b> #${{ github.run_number }}%0A• <b>Link:</b> <a href='${RUN_URL}'>View Failed Job Log</a>"

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" \
              -d "parse_mode=HTML" > /dev/null
          fi
